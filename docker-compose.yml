services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: taban_uncle
      MYSQL_USER: studio
      MYSQL_PASSWORD: studio_dev_password
      MYSQL_ROOT_PASSWORD: root_dev_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ustudio", "-pstudio_dev_password"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
